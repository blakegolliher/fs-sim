# fs-sim quick-start configuration
#
#   1. Point base_dir at a directory on the filesystem you want to test
#      (e.g. an NFS mount). fs-sim creates everything under it.
#   2. Populate:  ./fs-sim --config=config-quickstart.yaml populate
#   3. Churn it:  ./fs-sim --config=config-quickstart.yaml update
#
# This shape creates ~100k files across ~10k directories (roughly 6 GB
# with the 1% large-file mix below). Scale target_dirs/target_files up
# once you've seen it run.

base_dir: "/mnt/your-nfs-mount/fs-sim-test"   # <-- EDIT ME
log_file: "/tmp/fs-sim-files.log"

# Initial population targets
target_dirs: 10000
target_files: 100000

# Parallelism: 0 = auto (4x CPU cores). NFS creates are latency-bound,
# so more workers usually means more throughput — try 64-256 against a
# fast array.
workers: 0

# Tree shape
max_depth: 6
max_subdirs_per_dir: 10

# File sizes: mostly small files, 1% between 1MB and 10MB.
file_size:
  min_normal: 0
  max_normal: 8192
  large_file_chance: 1
  min_large: 1048576
  max_large: 10485760

# Timestamps: files/dirs get random atime and mtime between these epochs.
min_file_age: 1704067200   # 2024-01-01
max_file_age: 0            # 0 = now

# Ownership: only used when running as root (chown is skipped otherwise).
# UIDs/GIDs must exist on the system if you do run as root.
uids: [1000]
gids: [1000]

# Update mode: how long one run lasts and the mix of operations.
update_duration_seconds: 300
action_weights:
  create_file: 40
  delete_file: 20
  append_file: 20
  change_metadata: 15
  touch_file: 5

# Top-level directories and the extensions files get inside each.
file_extensions:
  home: [".txt", ".doc", ".pdf", ".jpg", ".mp3", ".zip", ".md"]
  scratch: [".c", ".h", ".o", ".log", ".tmp", ".sh", ".py"]
  data: [".csv", ".json", ".parquet", ".gz", ".dat"]
  web: [".html", ".css", ".js", ".svg", ".xml"]
