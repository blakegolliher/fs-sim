# Benchmark: 200M File Hierarchical Mix
# 200M files across 150K directories (~1,333 files/dir)
# Small files with 1% chance of larger files
# 50 file extensions, 100 UIDs/GIDs, 2+ year timestamp spread
#
# Space estimate:
#   Normal files (99%): ~198M x 4.5KB avg  = ~891 GB
#   Large files  (1%):  ~2M   x 5.5MB avg  = ~11 TB
#   Total data:                             = ~12 TB
#   With filesystem overhead:               = ~13-14 TB
#
# If 12TB is too much, reduce max_large or set large_file_chance to 0.
# With large_file_chance: 0, total is ~1 TB.
#
# NOTE: The code sets atime and mtime to the same random value per file.
# Across all 200M files, both atime and mtime will span the full 2+ year
# range, but per-file atime == mtime. If you need them independent,
# the Go code would need a small change in setMetadata().

base_dir: "/mnt/syncengine-demo/bench/200m-mix"
log_file: "/tmp/fs_sim_200m_mix.log"

target_dirs: 150000
target_files: 200000000

max_depth: 8 
max_subdirs_per_dir: 20

# Small files (4KB avg) with 1% large files
file_size:
  min_normal: 1024
  max_normal: 8192
  large_file_chance: 1
  min_large: 1048576       # 1MB
  max_large: 10485760      # 10MB

workers: 256

# Timestamp range: Jan 1 2024 - now (~Feb 2026) = 2+ years
min_file_age: 1704067200   # January 1, 2024 00:00:00 UTC
max_file_age: 0            # 0 = current time

# 100 UIDs (1000-1099) and 100 GIDs (1000-1099)
uids: [
  1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
  1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
